name: java-event-bus-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile production sources
        run: |
          mkdir -p out/main
          javac -Xlint:all -Werror -d out/main $(find src/main/java -name '*.java' -print)
      - name: Compile tests
        run: |
          mkdir -p out/test
          javac -Xlint:all -Werror -cp out/main -d out/test $(find src/test/java -name '*.java' -print)
      - name: Run tests
        run: java -cp out/main:out/test com.sky.eventbus.EventBusTest
      - name: Build runnable jar
        run: jar --create --file sky-event-bus.jar --main-class com.sky.eventbus.Main -C out/main .
      - name: CLI smoke test
        run: java -jar sky-event-bus.jar | grep -q '"service":"sky-java-event-bus"'
      - name: Build image
        run: docker build -t sky-java-event-bus:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint=id sky-java-event-bus:ci -u)" != "0"
      - name: Container smoke test
        run: docker run --rm sky-java-event-bus:ci | grep -q '"service":"sky-java-event-bus"'
